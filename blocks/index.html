<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Block World</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1d1a17">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root { --ink: #fff; --panel: #2b2620; --panel2: #3a332b; --edge: #120f0c; --green: #5fae3c; --gold: #f2c230; --red: #e5533d; }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--ink);
    font-family: "Trebuchet MS", system-ui, -apple-system, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; image-rendering: pixelated; }
  button { font-family: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  .hidden { display: none !important; }

  #hud { position: fixed; inset: 0; pointer-events: none; padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
  #hud > * { pointer-events: auto; }
  #topl { position: absolute; top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); max-width: min(62vw, 430px); }
  #topr { position: absolute; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); display: flex; gap: 8px; }
  #hearts { font-size: 17px; letter-spacing: 1px; filter: drop-shadow(1px 1px 0 #000); line-height: 1; margin-bottom: 6px; white-space: nowrap; }
  .chip { background: rgba(20,16,12,.72); border: 2px solid rgba(0,0,0,.6); border-radius: 10px; padding: 6px 10px; font-size: 15px; font-weight: bold; }
  #quest { display: block; text-align: left; max-width: 100%; line-height: 1.25; }
  #quest small { display: block; font-weight: normal; opacity: .85; font-size: 13px; }
  #depth { margin-top: 6px; display: inline-block; font-size: 13px; }

  #ctrl { position: absolute; left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); bottom: calc(max(10px, env(safe-area-inset-bottom)) + 62px); display: flex; align-items: flex-end; gap: 10px; pointer-events: none; }
  #ctrl > * { pointer-events: auto; }
  #ctrl .sp { flex: 1; pointer-events: none; }
  .pad { width: 66px; height: 66px; border-radius: 16px; font-size: 28px; background: rgba(20,16,12,.55); border: 3px solid rgba(255,255,255,.35); touch-action: none; }
  .pad.on { background: rgba(95,174,60,.7); }
  #bag { background: rgba(140,95,45,.8); }
  #eat { background: rgba(200,60,50,.75); }

  #hotbar { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(10px, env(safe-area-inset-bottom)); display: flex; gap: 3px; background: rgba(0,0,0,.55); padding: 3px; border-radius: 8px; border: 2px solid #000; }
  .slot { position: relative; width: 48px; height: 48px; background: rgba(139,139,139,.55); border: 2px solid #555; border-radius: 4px; display: grid; place-items: center; padding: 0; }
  .slot img { width: 34px; height: 34px; image-rendering: pixelated; pointer-events: none; }
  .slot .n { position: absolute; right: 2px; bottom: 0; font-size: 14px; font-weight: bold; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; pointer-events: none; }
  .slot.sel { border-color: #fff; box-shadow: 0 0 0 2px #fff inset; }
  .slot.pick { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold) inset; }
  #held { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(max(10px, env(safe-area-inset-bottom)) + 62px); font-weight: bold; font-size: 15px; text-shadow: 1px 1px 0 #000; pointer-events: none; transition: opacity .4s; white-space: nowrap; }

  #toast { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); background: rgba(20,16,12,.88); border: 3px solid var(--gold); border-radius: 12px; padding: 10px 18px; font-weight: bold; font-size: 18px; text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s; max-width: 86vw; }
  #toast.show { opacity: 1; }

  #panel { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom)); }
  .card { width: min(760px, 100%); max-height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--panel); border: 4px solid var(--edge); border-radius: 16px; padding: 16px; box-shadow: 0 8px 0 rgba(0,0,0,.35); }
  .card h2 { margin: 0 0 10px; font-size: 24px; }
  .card p { margin: 0 0 10px; line-height: 1.4; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .tab { background: var(--panel2); border: 2px solid var(--edge); border-radius: 10px; padding: 8px 12px; font-size: 16px; font-weight: bold; }
  .tab.on { background: var(--green); }
  .tab.x { margin-left: auto; background: #6b2a22; }
  .grid { display: grid; grid-template-columns: repeat(9, 48px); gap: 3px; justify-content: center; margin-bottom: 6px; }
  .grid .slot:nth-child(-n+9) { background: rgba(95,174,60,.35); }
  .hint { font-size: 13px; opacity: .8; text-align: center; margin: 0 0 12px; }
  .rec { display: flex; align-items: center; gap: 10px; background: var(--panel2); border: 2px solid var(--edge); border-radius: 10px; padding: 6px 8px; margin-bottom: 6px; }
  .rec.no { opacity: .5; }
  .rec img { width: 30px; height: 30px; image-rendering: pixelated; }
  .rec .nm { flex: 1; min-width: 0; font-weight: bold; font-size: 15px; }
  .rec .nm small { display: block; font-weight: normal; font-size: 12px; opacity: .85; }
  .ing { display: flex; gap: 6px; align-items: center; font-size: 13px; font-weight: bold; flex-wrap: wrap; }
  .ing span { display: inline-flex; align-items: center; gap: 2px; }
  .ing img { width: 22px; height: 22px; }
  .ing .lack { color: #ff8a7a; }
  .go { background: var(--green); border: 2px solid var(--edge); border-radius: 10px; padding: 8px 12px; font-weight: bold; font-size: 15px; white-space: nowrap; }
  .go:disabled { background: #555; }
  .big { display: block; width: 100%; margin: 8px 0; padding: 14px; font-size: 18px; font-weight: bold; border-radius: 12px; border: 3px solid var(--edge); background: var(--green); text-align: center; text-decoration: none; color: #fff; }
  .big.grey { background: #5a534b; }
  .big.red { background: #8e2f25; }
  .q { display: flex; gap: 10px; align-items: flex-start; padding: 8px; border-radius: 10px; background: var(--panel2); margin-bottom: 6px; border: 2px solid var(--edge); }
  .q.done { opacity: .6; }
  .q.next { border-color: var(--gold); }
  .q b { display: block; }
  .q small { opacity: .85; }
  .row2 { display: flex; gap: 8px; }
  .row2 > * { flex: 1; }
  .center { text-align: center; }
  .huge { font-size: 54px; line-height: 1; margin: 6px 0 10px; }
  @media (max-width: 520px) {
    .slot { width: 36px; height: 36px; } .slot img { width: 26px; height: 26px; } .slot .n { font-size: 12px; }
    .grid { grid-template-columns: repeat(9, 36px); }
    .pad { width: 58px; height: 58px; font-size: 24px; }
    #ctrl { bottom: calc(max(10px, env(safe-area-inset-bottom)) + 50px); }
    #held { bottom: calc(max(10px, env(safe-area-inset-bottom)) + 50px); }
    #hearts { font-size: 14px; }
    .chip { font-size: 13px; padding: 5px 8px; }
    #quest small { font-size: 12px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hidden">
  <div id="topl">
    <div id="hearts"></div>
    <button id="quest" class="chip"></button>
    <span id="depth" class="chip hidden"></span>
  </div>
  <div id="topr">
    <span id="timer" class="chip">⏱ 10:00</span>
    <button id="menuB" class="chip" aria-label="Menu">☰</button>
  </div>
  <div id="held"></div>
  <div id="ctrl">
    <button id="left" class="pad" aria-label="Left">◀</button>
    <button id="right" class="pad" aria-label="Right">▶</button>
    <div class="sp"></div>
    <button id="eat" class="pad hidden" aria-label="Eat">😋</button>
    <button id="bag" class="pad" aria-label="Bag and crafting">🎒</button>
    <button id="jump" class="pad" aria-label="Jump">⬆</button>
  </div>
  <div id="hotbar"></div>
</div>
<div id="toast"></div>
<div id="panel" class="hidden"><div class="card" id="card"></div></div>

<script>
'use strict';
// ============================================================================
// Block World: a side-on Minecraft-style mining, crafting and building game.
// It is a reward game like Duck Drop, so it shares Duck Drop's rules and its
// time budget: locked until today's 10 minutes of times tables are done, then
// 10 minutes of play a day, or 20 if she has also done 5 minutes of Spelling
// Quest. Time used is counted in the same S.duck.secs field of the Times Table
// Miner state (localStorage 'ttMiner.v1'). The world itself is saved on this
// device only (localStorage 'blockWorld.v1').
// ============================================================================
const STORE = 'blockWorld.v1', TT = 'ttMiner.v1';
const DAY_SECS = 600;            // times tables needed today to unlock (same as Times Table Miner)
const PLAY_SECS = 600, BONUS_SECS = 1200, SPELL_SECS = 300;  // play a day (shared with Duck Drop); 20 min with 5 min of spelling
const FREE_DAYS = [];            // one-off unlock days, like Duck Drop's DUCK_FREE_DAYS
const W = 240, H = 90;           // world size in blocks
const REACH = 4.6, DAY_LEN = 300; // reach in blocks; one day-night cycle in seconds

// ---------- Times Table Miner link: unlock + shared play time ----------
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function readTT() { try { return JSON.parse(localStorage.getItem(TT)) || {}; } catch (e) { return {}; } }
function writeTT(tt) { try { localStorage.setItem(TT, JSON.stringify(tt)); } catch (e) {} }
const tablesToday = tt => Math.floor(((tt.days || {})[today()] || 0));
const unlocked = tt => tablesToday(tt) >= DAY_SECS || FREE_DAYS.includes(today());
function spellToday() { try { return (JSON.parse(localStorage.getItem('spq_secs')) || {})[today()] || 0; } catch (e) { return 0; } }
const allowance = () => spellToday() >= SPELL_SECS ? BONUS_SECS : PLAY_SECS;
const usedToday = tt => (tt.duck && tt.duck.date === today()) ? (tt.duck.secs || 0) : 0;
function bankTime(sec) {
  if (sec <= 0) return;
  const tt = readTT();
  const best = (tt.duck || {}).best || 0;
  tt.duck = { date: today(), secs: usedToday(tt) + sec, best };
  writeTT(tt);
}
// Called by the Firebase module with the synced Times Table Miner state, so minutes done on
// another device count here too. Read-only: this page never writes to Firebase.
window.bwRemote = function (r, spell) {
  if (spell) {
    try {
      const loc = JSON.parse(localStorage.getItem('spq_secs')) || {};
      for (const [d, v] of Object.entries(spell)) if (v > (loc[d] || 0)) loc[d] = v;
      localStorage.setItem('spq_secs', JSON.stringify(loc));
    } catch (e) {}
  }
  if (!r) r = {};
  const tt = readTT();
  tt.days = tt.days || {};
  for (const [d, v] of Object.entries(r.days || {})) tt.days[d] = Math.max(v, tt.days[d] || 0);
  const a = tt.duck || {}, b = r.duck || {};
  tt.duck = { best: Math.max(a.best || 0, b.best || 0),
              date: (a.date || '') > (b.date || '') ? a.date : b.date || '',
              secs: a.date === b.date ? Math.max(a.secs || 0, b.secs || 0) : ((a.date || '') > (b.date || '') ? a.secs : b.secs) || 0 };
  writeTT(tt);
  if (mode === 'lock' && unlocked(tt) && allowance() - usedToday(tt) > 0) begin();
  else if (mode === 'lock') lockScreen();
  else if (mode === 'play') left = allowance() - usedToday(tt) - banked;
};

// ---------- Blocks and items ----------
const A = {}; let nextId = 0;
const DEF = [];
function blk(key, name, o) { const id = nextId++; A[key] = id; DEF[id] = Object.assign({ id, key, name, block: true, solid: true, opaque: true, hard: 1, tier: 0, pick: false, drop: id, light: 0, stack: 64 }, o); }
function itm(key, name, o) { const id = 100 + Object.keys(A).filter(k => A[k] >= 100).length; A[key] = id; DEF[id] = Object.assign({ id, key, name, block: false, stack: 64 }, o); }
const SOFT = { solid: false, opaque: false };
blk('AIR', 'Air', { ...SOFT, hard: 0, drop: null });
blk('GRASS', 'Grass Block', { hard: .6, drop: 'DIRT' });
blk('DIRT', 'Dirt', { hard: .5 });
blk('STONE', 'Stone', { hard: 2.2, tier: 1, pick: true, drop: 'COBBLE' });
blk('COBBLE', 'Cobblestone', { hard: 2.4, tier: 1, pick: true });
blk('LOG', 'Oak Log', { hard: 1.4 });
blk('LEAVES', 'Leaves', { opaque: false, hard: .25, drop: null });
blk('PLANKS', 'Oak Planks', { hard: 1.1 });
blk('SAND', 'Sand', { hard: .5 });
blk('WATER', 'Water', { ...SOFT, hard: Infinity, drop: null, liquid: true });
blk('BEDROCK', 'Bedrock', { hard: Infinity, drop: null });
blk('COAL_ORE', 'Coal Ore', { hard: 2.6, tier: 1, pick: true, drop: 'COAL' });
blk('IRON_ORE', 'Iron Ore', { hard: 2.8, tier: 2, pick: true });
blk('GOLD_ORE', 'Gold Ore', { hard: 2.8, tier: 3, pick: true });
blk('DIAMOND_ORE', 'Diamond Ore', { hard: 3, tier: 3, pick: true, drop: 'DIAMOND' });
blk('EMERALD_ORE', 'Emerald Ore', { hard: 3, tier: 3, pick: true, drop: 'EMERALD' });
blk('TABLE', 'Crafting Table', { hard: 1.3, use: true });
blk('FURNACE', 'Furnace', { hard: 2.6, tier: 1, pick: true, use: true });
blk('TORCH', 'Torch', { ...SOFT, hard: .05, light: 14 });
blk('GLASS', 'Glass', { opaque: false, hard: .4 });
blk('LADDER', 'Ladder', { ...SOFT, hard: .5, climb: true });
blk('WOOL', 'White Wool', { hard: .6 });
blk('WOOL_RED', 'Red Wool', { hard: .6 });
blk('WOOL_YELLOW', 'Yellow Wool', { hard: .6 });
blk('WOOL_BLUE', 'Blue Wool', { hard: .6 });
blk('WOOL_PINK', 'Pink Wool', { hard: .6 });
blk('STONE_BRICKS', 'Stone Bricks', { hard: 2.4, tier: 1, pick: true });
blk('COBWEB', 'Cobweb', { ...SOFT, hard: 2.5, drop: 'STRING', web: true });
blk('POPPY', 'Poppy', { ...SOFT, hard: .05, plant: true });
blk('DANDELION', 'Dandelion', { ...SOFT, hard: .05, plant: true });
blk('CORNFLOWER', 'Cornflower', { ...SOFT, hard: .05, plant: true });
blk('TULIP', 'Pink Tulip', { ...SOFT, hard: .05, plant: true });
blk('TALLGRASS', 'Tall Grass', { ...SOFT, hard: .05, drop: null, plant: true });
blk('BED', 'Bed', { ...SOFT, hard: .4, use: true });
blk('GOLD_BLOCK', 'Block of Gold', { hard: 3, tier: 3, pick: true });
blk('DIAMOND_BLOCK', 'Block of Diamond', { hard: 3.5, tier: 3, pick: true });
blk('EMERALD_BLOCK', 'Block of Emerald', { hard: 3.5, tier: 3, pick: true });
blk('LANTERN', 'Lantern', { opaque: false, hard: .8, light: 15 });
itm('STICK', 'Stick');
itm('COAL', 'Coal');
itm('IRON', 'Iron Ingot');
itm('GOLD', 'Gold Ingot');
itm('DIAMOND', 'Diamond');
itm('EMERALD', 'Emerald');
itm('STRING', 'String');
itm('APPLE', 'Apple', { food: 4 });
itm('RAW_COD', 'Raw Cod', { food: 2 });
itm('COOKED_COD', 'Cooked Cod', { food: 6 });
itm('WOOD_PICK', 'Wooden Pickaxe', { stack: 1, pickTier: 1 });
itm('STONE_PICK', 'Stone Pickaxe', { stack: 1, pickTier: 2 });
itm('IRON_PICK', 'Iron Pickaxe', { stack: 1, pickTier: 3 });
itm('DIAMOND_PICK', 'Diamond Pickaxe', { stack: 1, pickTier: 4 });
itm('WOOD_SWORD', 'Wooden Sword', { stack: 1, dmg: 4 });
itm('STONE_SWORD', 'Stone Sword', { stack: 1, dmg: 5 });
itm('IRON_SWORD', 'Iron Sword', { stack: 1, dmg: 6 });
itm('DIAMOND_SWORD', 'Diamond Sword', { stack: 1, dmg: 8 });
itm('ROD', 'Fishing Rod', { stack: 1 });
for (const d of DEF.concat(Object.values(DEF))) if (d && typeof d.drop === 'string') d.drop = A[d.drop];
const D = id => DEF[id];
const PICK_SPEED = [1, 2, 4, 6, 8];
const isBlock = id => id < 100 && id > 0;

const RECIPES = [
  { out: 'PLANKS', n: 4, in: [['LOG', 1]] },
  { out: 'STICK', n: 4, in: [['PLANKS', 2]] },
  { out: 'TABLE', n: 1, in: [['PLANKS', 4]] },
  { out: 'TORCH', n: 4, in: [['COAL', 1], ['STICK', 1]] },
  { out: 'WOOD_PICK', n: 1, in: [['PLANKS', 3], ['STICK', 2]], table: 1 },
  { out: 'WOOD_SWORD', n: 1, in: [['PLANKS', 2], ['STICK', 1]], table: 1 },
  { out: 'STONE_PICK', n: 1, in: [['COBBLE', 3], ['STICK', 2]], table: 1 },
  { out: 'STONE_SWORD', n: 1, in: [['COBBLE', 2], ['STICK', 1]], table: 1 },
  { out: 'FURNACE', n: 1, in: [['COBBLE', 8]], table: 1 },
  { out: 'LADDER', n: 3, in: [['STICK', 7]], table: 1 },
  { out: 'ROD', n: 1, in: [['STICK', 3], ['STRING', 2]], table: 1 },
  { out: 'BED', n: 1, in: [['WOOL', 3], ['PLANKS', 3]], table: 1 },
  { out: 'IRON_PICK', n: 1, in: [['IRON', 3], ['STICK', 2]], table: 1 },
  { out: 'IRON_SWORD', n: 1, in: [['IRON', 2], ['STICK', 1]], table: 1 },
  { out: 'LANTERN', n: 1, in: [['IRON', 1], ['TORCH', 1]], table: 1 },
  { out: 'DIAMOND_PICK', n: 1, in: [['DIAMOND', 3], ['STICK', 2]], table: 1 },
  { out: 'DIAMOND_SWORD', n: 1, in: [['DIAMOND', 2], ['STICK', 1]], table: 1 },
  { out: 'STONE_BRICKS', n: 4, in: [['STONE', 4]], table: 1 },
  { out: 'WOOL_RED', n: 1, in: [['WOOL', 1], ['POPPY', 1]] },
  { out: 'WOOL_YELLOW', n: 1, in: [['WOOL', 1], ['DANDELION', 1]] },
  { out: 'WOOL_BLUE', n: 1, in: [['WOOL', 1], ['CORNFLOWER', 1]] },
  { out: 'WOOL_PINK', n: 1, in: [['WOOL', 1], ['TULIP', 1]] },
  { out: 'GOLD_BLOCK', n: 1, in: [['GOLD', 9]], table: 1 },
  { out: 'DIAMOND_BLOCK', n: 1, in: [['DIAMOND', 9]], table: 1 },
  { out: 'EMERALD_BLOCK', n: 1, in: [['EMERALD', 9]], table: 1 },
].map(r => ({ out: A[r.out], n: r.n, in: r.in.map(([k, c]) => [A[k], c]), table: !!r.table }));
const SMELT = [['IRON_ORE', 'IRON'], ['GOLD_ORE', 'GOLD'], ['SAND', 'GLASS'], ['COBBLE', 'STONE'], ['RAW_COD', 'COOKED_COD'], ['LOG', 'COAL']]
  .map(([a, b]) => [A[a], A[b]]);

// ---------- Quests: always a next goal on screen ----------
const QUESTS = [
  ['wood', 'Punch a tree', 'Hold your finger on a tree trunk until it breaks. Get 4 logs.', s => (s.mined[A.LOG] || 0) >= 4],
  ['planks', 'Planks!', 'Open 🎒 and turn a log into planks.', s => s.crafted[A.PLANKS]],
  ['table', 'Your own workshop', 'Craft a Crafting Table and place it on the ground.', s => s.placed[A.TABLE]],
  ['wpick', 'Wooden pickaxe', 'Stand next to your table and craft a wooden pickaxe.', s => s.crafted[A.WOOD_PICK]],
  ['stone', 'Stone age', 'Dig down and mine 10 stone with your pickaxe.', s => (s.mined[A.STONE] || 0) >= 10],
  ['spick', 'Stone pickaxe', 'Craft a stone pickaxe from cobblestone and sticks.', s => s.crafted[A.STONE_PICK]],
  ['torch', 'Let there be light', 'Mine coal (black spots in stone), craft torches and place one.', s => s.placed[A.TORCH]],
  ['furnace', 'Hot stuff', 'Craft a furnace from 8 cobblestone and place it.', s => s.placed[A.FURNACE]],
  ['iron', 'Iron!', 'Mine iron ore (peachy spots, deeper down) and smelt it in your furnace.', s => s.smelted[A.IRON]],
  ['ipick', 'Iron pickaxe', 'Craft an iron pickaxe. Now you can mine gold and diamonds!', s => s.crafted[A.IRON_PICK]],
  ['wool', 'Woolly jumper', 'Tap a sheep to collect its wool. Get 3.', s => s.sheared >= 3],
  ['bed', 'Sweet dreams', 'Craft a bed and tap it at night to sleep until morning.', s => s.slept >= 1],
  ['fish', 'Gone fishing', 'Find cobwebs in caves for string, craft a fishing rod and tap a pond.', s => s.fish >= 1],
  ['cat', 'Best friend', 'Hold a raw cod and tap a stray cat until it trusts you.', s => s.tamed >= 1],
  ['zombie', 'Zombie hunter', 'Defeat 5 zombies. A sword helps!', s => s.kills >= 5],
  ['diamond', 'Diamonds!', 'Dig really deep with an iron pickaxe and find a diamond.', s => s.mined[A.DIAMOND_ORE]],
  ['dpick', 'Diamond pickaxe', 'Craft a diamond pickaxe, the best there is.', s => s.crafted[A.DIAMOND_PICK]],
  ['emerald', 'Emerald hunter', 'Emeralds are rare green gems, deep underground. Find one.', s => s.mined[A.EMERALD_ORE]],
  ['rainbow', 'Rainbow builder', 'Make red, yellow, blue and pink wool from flowers.', s => [A.WOOL_RED, A.WOOL_YELLOW, A.WOOL_BLUE, A.WOOL_PINK].every(k => s.crafted[k])],
  ['bedrock', 'Bottom of the world', 'Dig all the way down to bedrock.', s => s.deepest >= H - 5],
  ['builder', 'Master builder', 'Place 150 blocks. Build a house, a tower, anything!', s => s.placedTotal >= 150],
  ['bling', 'Bling', 'Craft a block of gold, diamond or emerald.', s => s.crafted[A.GOLD_BLOCK] || s.crafted[A.DIAMOND_BLOCK] || s.crafted[A.EMERALD_BLOCK]],
];

// ---------- Random numbers and noise ----------
function rng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  return (a * (1 - ux) + b * ux) * (1 - uy) + (c * (1 - ux) + d * ux) * uy;

// ---------- World generation ----------
function generate(seed) {
  const R = rng(seed), w = new Uint8Array(W * H), surf = new Array(W);
  const set = (x, y, id) => { if (x >= 0 && x < W && y >= 0 && y < H) w[y * W + x] = id; };
  const get = (x, y) => (x >= 0 && x < W && y >= 0 && y < H) ? w[y * W + x] : A.STONE;
  const hAt = x => Math.round(30 + (noise1(seed, x * 0.025) - 0.5) * 22 + (noise1(seed + 7, x * 0.09) - 0.5) * 6);
  const mid = W >> 1;
  for (let x = 0; x < W; x++) surf[x] = Math.abs(x - mid) < 6 ? hAt(mid) : hAt(x);
  for (let x = 0; x < W; x++) {
    const s = surf[x], dirt = 3 + (hash2(seed, x, 99) < .5 ? 1 : 0);
    for (let y = 0; y < H; y++) {
      let id = y < s ? A.AIR : y === s ? A.GRASS : y <= s + dirt ? A.DIRT : A.STONE;
      if (y === H - 1 || (y >= H - 3 && R() < .5)) id = A.BEDROCK;
      w[y * W + x] = id;
    }
  }
  // caves: winding tunnels plus some open caverns
  for (let x = 0; x < W; x++) for (let y = surf[x] + 7; y < H - 2; y++) {
    const n = noise2(seed + 11, x * .07, y * .11), m = noise2(seed + 23, x * .045, y * .06);
    if ((Math.abs(n - .5) < .055 && m > .32) || noise2(seed + 31, x * .1, y * .14) > .8) set(x, y, A.AIR);
  }
  // ore veins
  const vein = (id, tries, y0, y1, size) => {
    for (let i = 0; i < tries; i++) {
      let x = Math.floor(R() * W), y = y0 + Math.floor(R() * (y1 - y0)), n = size[0] + Math.floor(R() * (size[1] - size[0] + 1));
      while (n-- > 0) { if (get(x, y) === A.STONE) set(x, y, id); x += Math.floor(R() * 3) - 1; y += Math.floor(R() * 3) - 1; }
    }
  };
  vein(A.COAL_ORE, 300, 22, H - 3, [4, 8]);
  vein(A.IRON_ORE, 190, 38, H - 3, [3, 6]);
  vein(A.GOLD_ORE, 60, 60, H - 3, [2, 5]);
  vein(A.DIAMOND_ORE, 34, 72, H - 3, [1, 4]);
  vein(A.EMERALD_ORE, 26, 48, H - 3, [1, 1]);
  // cobwebs hanging in deeper caves
  for (let x = 0; x < W; x++) for (let y = 44; y < H - 3; y++)
    if (get(x, y) === A.AIR && D(get(x, y - 1)).solid && R() < .05) set(x, y, A.COBWEB);
  // ponds with sandy edges
  const ponds = [];
  for (let tries = 0; ponds.length < 4 && tries < 60; tries++) {
    const x = 12 + Math.floor(R() * (W - 30)), pw = 6 + Math.floor(R() * 4);
    if (Math.abs(x + pw / 2 - mid) < 18 || ponds.some(p => Math.abs(p - x) < 30)) continue;
    ponds.push(x);
    let base = 0; for (let dx = 0; dx < pw; dx++) base = Math.max(base, surf[x + dx]);
    for (let dx = -1; dx <= pw; dx++) {
      const cx = x + dx, depth = (dx < 0 || dx >= pw) ? 0 : (dx === 0 || dx === pw - 1) ? 1 : (dx === 1 || dx === pw - 2) ? 2 : 3;
      for (let y = 0; y < base; y++) set(cx, y, A.AIR);
      for (let y = base; y <= base + 5; y++) {
        const d = y - base;
        if (d < depth) set(cx, y, A.WATER);
        else if (d <= depth + 1) set(cx, y, A.SAND);
        else if (get(cx, y) === A.AIR || get(cx, y) === A.GRASS) set(cx, y, A.DIRT);
      }
      surf[cx] = base;
    }
  }
  // trees
  let last = -9;
  for (let x = 3; x < W - 3; x++) {
    const s = surf[x];
    if (get(x, s) !== A.GRASS || x - last < 4 || Math.abs(x - mid) < 2 || R() > .11) continue;
    last = x;
    const th = 4 + Math.floor(R() * 3), top = s - th;
    for (let y = s - 1; y >= top; y--) set(x, y, A.LOG);
    for (let ly = top - 2; ly <= top + 1; ly++) for (let lx = x - 2; lx <= x + 2; lx++) {
      const edge = Math.abs(lx - x) === 2 && (ly === top - 2 || ly === top + 1);
      if (edge && R() < .6) continue;
      if (get(lx, ly) === A.AIR) set(lx, ly, A.LEAVES);
    }
  }
  // grass and flowers
  const FLOWERS = [A.POPPY, A.DANDELION, A.CORNFLOWER, A.TULIP];
  for (let x = 0; x < W; x++) {
    const s = surf[x];
    if (get(x, s) !== A.GRASS || get(x, s - 1) !== A.AIR) continue;
    const r = R();
    if (r < .13) set(x, s - 1, A.TALLGRASS); else if (r < .19) set(x, s - 1, FLOWERS[Math.floor(R() * 4)]);
  }
  // animals: sheep and stray cats live on the grass
  const ents = [];
  const grassX = () => { for (let i = 0; i < 200; i++) { const x = 5 + Math.floor(R() * (W - 10)); if (get(x, surf[x]) === A.GRASS && Math.abs(x - mid) > 8) return x; } return 20; };
  for (let i = 0; i < 7; i++) { const x = grassX(); ents.push(mob('sheep', x + .5, surf[x], { pink: R() < .2 })); }
  const catCols = ['ginger', 'black', 'tabby'];
  for (let i = 0; i < 3; i++) { const x = grassX(); ents.push(mob('cat', x + .5, surf[x], { col: catCols[i] })); }
  return { w, surf, spawn: { x: mid + .5, y: surf[mid] }, ents };
}

function freshStats() { return { mined: {}, crafted: {}, placed: {}, smelted: {}, kills: 0, fish: 0, tamed: 0, slept: 0, sheared: 0, placedTotal: 0, deepest: 0 }; }
function newGame() {
  const seed = (Date.now() % 1e9) | 0;

  world = g.w; surf = g.surf; ents = g.ents;
  G = { v: 1, seed, time: .05, inv: new Array(27).fill(null), sel: 0, spawn: g.spawn, stats: freshStats(), quests: {}, fuel: 0,

function player(x, y) { return { x, y, vx: 0, vy: 0, w: .6, h: 1.75, hp: 20, onGround: false, fallFrom: y, hurtT: 0, lastHurt: -99, regenT: 0, dir: 1, walkT: 0, swing: 0 }; }

}

// ---------- Save / load (world stored run-length encoded) ----------
function rle(u8) {
  const out = [];

}

}
function save() {
  if (!G) return;
  const keep = ents.filter(e => e.type === 'sheep' || e.type === 'cat').map(e => {
    const o = { type: e.type, x: +e.x.toFixed(2), y: +e.y.toFixed(2), hp: e.hp };
    for (const k of ['pink', 'col', 'tame', 'sit', 'sheared', 'regrow', 'name', 'trust']) if (e[k] !== undefined) o[k] = e[k];
    return o;
  });
  const data = Object.assign({}, G, { world: rle(world), surf, ents: keep, p: { x: P.x, y: P.y, hp: P.hp } });
  try { localStorage.setItem(STORE, JSON.stringify(data)); } catch (e) { console.error(e); }
}
function load() {
  try {
    const raw = localStorage.getItem(STORE); if (!raw) return false;
    const d = JSON.parse(raw);
    world = unrle(d.world); surf = d.surf;
    ents = (d.ents || []).map(o => Object.assign(mob(o.type, o.x, o.y), o));
    P = player(d.p.x, d.p.y); P.hp = d.p.hp || 20;
    delete d.world; delete d.surf; delete d.ents; delete d.p;
    G = Object.assign({ stats: freshStats(), quests: {}, fuel: 0, catNames: {} }, d);
    G.stats = Object.assign(freshStats(), G.stats);
    return true;
  } catch (e) { console.error(e); return false; }
}

// ---------- Inventory ----------
function count(id) { return G.inv.reduce((n, s) => n + (s && s.id === id ? s.n : 0), 0); }
function give(id, n) {
  const max = D(id).stack;
  for (const s of G.inv) if (n > 0 && s && s.id === id && s.n < max) { const k = Math.min(n, max - s.n); s.n += k; n -= k; }
  for (let i = 0; i < G.inv.length && n > 0; i++) if (!G.inv[i]) { const k = Math.min(n, max); G.inv[i] = { id, n: k }; n -= k; }
  if (n > 0) toast('Your bag is full!');
  drawHotbar();
  return n;
}
function take(id, n) {
  for (let i = G.inv.length - 1; i >= 0 && n > 0; i--) {
    const s = G.inv[i]; if (!s || s.id !== id) continue;
    const k = Math.min(n, s.n); s.n -= k; n -= k; if (!s.n) G.inv[i] = null;
  }

}

    const table = near(A.TABLE);
    body += RECIPES.map((r, i) => {
      const have = r.in.every(([id, n]) => count(id) >= n), ok = have && (!r.table || table);
      const needs = r.table && !table ? '<small>Stand next to a crafting table</small>' : '';
      return `<div class="rec ${ok ? '' : 'no'}"><img src="${ICON_URL[r.out]}" alt=""><div class="nm">${D(r.out).name}${r.n > 1 ? ' ×' + r.n : ''}${needs}
        <div class="ing">${r.in.map(([id, n]) => `<span class="${count(id) >= n ? '' : 'lack'}"><img src="${ICON_URL[id]}" alt="">${n}</span>`).join('')}</div></div>
        <button class="go" data-r="${i}" ${ok ? '' : 'disabled'}>Craft</button></div>`;
    }).join('');
  } else if (bagTab === 'furnace') {
    if (!near(A.FURNACE)) body += `<p class="center">Stand next to a furnace to smelt things. Craft one from 8 cobblestone at a crafting table.</p>`;
    else {
      body += `<p class="center">🔥 Fuel: <b>${Math.floor(G.fuel)}</b> smelts. Coal gives 8, a log 2, a plank 1. Fuel is used up automatically.</p>`;
      body += SMELT.map(([a, b], i) => `<div class="rec ${count(a) ? '' : 'no'}"><img src="${ICON_URL[a]}" alt=""><div class="nm">${D(a).name} → ${D(b).name}<small>You have ${count(a)}</small></div><img src="${ICON_URL[b]}" alt="">
        <button class="go" data-s="${i}" data-n="1" ${count(a) ? '' : 'disabled'}>Smelt 1</button><button class="go" data-s="${i}" data-n="64" ${count(a) > 1 ? '' : 'disabled'}>All</button></div>`).join('');
    }
  } else {
    const done = QUESTS.filter(q => G.quests[q[0]]).length, next = QUESTS.find(q => !G.quests[q[0]]);
    body += `<p class="center"><b>⭐ ${done} of ${QUESTS.length} quests done</b></p>` + QUESTS.map(q => `<div class="q ${G.quests[q[0]] ? 'done' : ''} ${q === next ? 'next' : ''}"><div>${G.quests[q[0]] ? '✅' : '⬜'}</div><div><b>${q[1]}</b><small>${q[2]}</small></div></div>`).join('');
  }
  showPanel(tabs + body);
  $('close').onclick = closePanel;
  document.querySelectorAll('.tab[data-t]').forEach(b => b.onclick = () => { pickSlot = null; openBag(b.dataset.t); });
  document.querySelectorAll('.grid .slot').forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if (pickSlot === null) { if (G.inv[i]) pickSlot = i; }
    else {
      const a = G.inv[pickSlot], c = G.inv[i];
      if (c && a && c.id === a.id && i !== pickSlot && c.n < D(c.id).stack) { const k = Math.min(a.n, D(c.id).stack - c.n); c.n += k; a.n -= k; if (!a.n) G.inv[pickSlot] = null; }
      else { G.inv[pickSlot] = c; G.inv[i] = a; }
      pickSlot = null; drawHotbar();
    }
    openBag();
  });
  document.querySelectorAll('.go[data-r]').forEach(b => b.onclick = () => craft(RECIPES[+b.dataset.r]));
  document.querySelectorAll('.go[data-s]').forEach(b => b.onclick = () => smelt(SMELT[+b.dataset.s], +b.dataset.n));
}
function craft(r) {
  if (!r.in.every(([id, n]) => count(id) >= n) || (r.table && !near(A.TABLE))) return;
  r.in.forEach(([id, n]) => take(id, n));
  give(r.out, r.n); sfx.pop();
  G.stats.crafted[r.out] = (G.stats.crafted[r.out] || 0) + r.n;
  checkQuests(); openBag();
}
function smelt([a, b], n) {
  let made = 0;
  while (made < n && count(a) > 0) {
    if (G.fuel < 1) {
      const f = [[A.COAL, 8], [A.LOG, 2], [A.PLANKS, 1]].find(([id]) => count(id) > (id === a ? 1 : 0));
      if (!f) { toast('No fuel! Put coal, logs or planks in your bag.'); break; }
      take(f[0], 1); G.fuel += f[1];
    }
    take(a, 1); G.fuel -= 1; give(b, 1); made++;
    G.stats.smelted[b] = (G.stats.smelted[b] || 0) + 1;
  }
  if (made) { sfx.pop(); toast(`Smelted ${made} ${D(b).name}`); }
  checkQuests(); openBag();
}
$('bag').addEventListener('click', () => openBag('craft'));
$('quest').addEventListener('click', () => openBag('quests'));
$('menuB').addEventListener('click', openMenu);
function openMenu() {
  const done = QUESTS.filter(q => G.quests[q[0]]).length;
  showPanel(`<div class="tabs"><h2 style="margin:0">🧱 Block World</h2><button class="tab x" id="close">✕</button></div>
    <p>⭐ ${done} of ${QUESTS.length} quests · ${Math.floor(G.time)} days in this world</p>
    <div class="row2"><button class="big ${G.peaceful ? 'grey' : ''}" id="mon">${G.peaceful ? '🌼 Peaceful: no monsters' : '🧟 Monsters: on'}</button><button class="big grey" id="snd">${G.sound ? '🔊 Sound on' : '🔇 Sound off'}</button></div>
    <button class="big" id="resume">▶ Keep playing</button>
    <a class="big grey" href="../tables/">⛏️ Times Table Miner</a>
    <a class="big grey" href="/">🏠 All games</a>
    <button class="big red" id="reset">Start a brand new world</button>
    <p class="hint">Play time is shared with Duck Drop: 10 minutes a day after your times tables, or 20 if you also do 5 minutes of Spelling Quest. Your world is saved on this device.</p>`);
  $('close').onclick = closePanel; $('resume').onclick = closePanel;
  $('mon').onclick = () => { G.peaceful = !G.peaceful; openMenu(); };
  $('snd').onclick = () => { G.sound = !G.sound; openMenu(); };
  $('reset').onclick = () => {
    if (!confirm('Start a brand new world? Everything you built in this one will be gone.')) return;
    if (!confirm('Are you really sure? This cannot be undone.')) return;
    const keep = { peaceful: G.peaceful, sound: G.sound };
    newGame(); Object.assign(G, keep, { welcomed: true }); save(); closePanel(); drawHotbar(); questLine();
  };
  document.querySelectorAll('#card a').forEach(a => a.addEventListener('click', () => { bankNow(); save(); }));
}

// ---------- Screens: locked, welcome, time up ----------
function lockScreen() {
  mode = 'lock'; $('hud').classList.add('hidden');
  const tt = readTT(), done = Math.floor(tablesToday(tt) / 60);
  const usedUp = unlocked(tt) && allowance() - usedToday(tt) <= 0;
  const spellLeft = Math.ceil((SPELL_SECS - spellToday()) / 60);
  const bonus = spellToday() < SPELL_SECS ? `<p>✏️ Do ${spellLeft} more minute${spellLeft === 1 ? '' : 's'} of Spelling Quest to get 20 minutes of play instead of 10.</p>` : '';
  showPanel(`<div class="center"><div class="huge">${usedUp ? '⏰' : '🔒'}</div><h2>Block World</h2>
    ${usedUp ? `<p>That's all your play time for today. Your world is saved and waiting.</p>${bonus || '<p>Come back tomorrow after your 10 minutes of times tables!</p>'}`
             : `<p>Block World unlocks when you've done today's 10 minutes of times tables.</p><p><b>You've done ${done} of 10 minutes today.</b></p>${bonus}`}
    <a class="big" href="../tables/">⛏️ Go to Times Table Miner</a>${bonus ? '<a class="big grey" href="../">✏️ Spelling Quest</a>' : ''}<a class="big grey" href="/">🏠 All games</a></div>`);
}
function welcome() {
  showPanel(`<div class="center"><div class="huge">🧱</div><h2>Welcome to Block World!</h2></div>
    <p>👆 <b>Hold your finger on a block</b> to mine it.</p>
    <p>🧱 <b>Tap an empty space</b> to put down the block in your hand. Pick what's in your hand from the bar at the bottom.</p>
    <p>🎒 <b>Open your bag</b> to craft tools. Follow the ⭐ quests at the top. They tell you what to do next.</p>
    <p>🌙 Zombies and creepers come out at night. Build a shelter and light it with torches!</p>
    <button class="big" id="go">Let's go!</button>`);
  $('go').onclick = () => { G.welcomed = true; closePanel(); };
}
function timeUp() {
  bankNow(); save(); mode = 'over'; $('hud').classList.add('hidden');
  const more = spellToday() < SPELL_SECS ? '<p>✏️ Do 5 minutes of Spelling Quest today and you get 10 more minutes!</p>' : '<p>See you tomorrow after your times tables!</p>';
  showPanel(`<div class="center"><div class="huge">⏰</div><h2>Play time is up!</h2><p>Your world is saved.</p>${more}
    <a class="big" href="/">🏠 All games</a>${spellToday() < SPELL_SECS ? '<a class="big grey" href="../">✏️ Spelling Quest</a>' : ''}<a class="big grey" href="../tables/">⛏️ Times Table Miner</a></div>`);
}
function bankNow() { const s = Math.round(banked); if (s > 0) { bankTime(s); banked -= s; } }

// ---------- Start ----------
function begin() {
  const tt = readTT();
  left = allowance() - usedToday(tt);
  if (!unlocked(tt) || left <= 0) return lockScreen();
  if (!G && !load()) newGame();
  mode = 'play'; closePanel(); $('hud').classList.remove('hidden');
  drawHotbar(); questLine(); checkQuests();
  if (!G.welcomed) welcome();
}
let last = performance.now();
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, Math.max(0, (ts - last) / 1000)); last = ts;
  if (mode === 'play') {
    if (!panelOpen()) update(dt);
    left -= dt; banked += dt;
    if (banked >= 5) bankNow();
    hudTick();
    if (left <= 0) timeUp();
  }
  render();
}
addEventListener('pagehide', () => { if (mode === 'play') { bankNow(); save(); } });
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play') { bankNow(); save(); } last = performance.now(); });
resize(); buildArt();
window.BW = { get G() { return G; }, get P() { return P; }, get ents() { return ents; }, tile, setTile, A, give, craft, RECIPES, save, load, begin, get mode() { return mode; }, get left() { return left; }, tap, breakBlock, update, get cam() { return { camX, camY, TS, dpr }; } };
begin();
requestAnimationFrame(frame);
</script>
